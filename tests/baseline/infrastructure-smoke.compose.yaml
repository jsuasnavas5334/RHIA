services:
  postgres:
    image: postgres:18
    pull_policy: never
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: rhia_test
      POSTGRES_PASSWORD: rhia_baseline_smoke_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhia_test -d n8n"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [rhia_internal]
    volumes:
      - postgres_data:/var/lib/postgresql

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: rhia_test
      DB_POSTGRESDB_PASSWORD: rhia_baseline_smoke_only
      N8N_ENCRYPTION_KEY: rhia-baseline-smoke-only-not-a-secret
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:5678/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [rhia_internal]
    volumes:
      - n8n_data:/home/node/.n8n

  searxng:
    image: searxng/searxng:latest
    pull_policy: never
    environment:
      SEARXNG_SECRET: rhia-baseline-smoke-only-not-a-secret
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx OK"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [rhia_internal]
    volumes:
      - searxng_cache:/var/cache/searxng

  ollama:
    image: ollama/ollama:latest
    pull_policy: never
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [rhia_internal]
    volumes:
      - ollama_data:/root/.ollama

networks:
  rhia_internal:
    internal: true

volumes:
  postgres_data:
  n8n_data:
  searxng_cache:
  ollama_data:
