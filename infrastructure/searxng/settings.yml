# SearXNG Settings
# Local production configuration for RHIA

# Server configuration
server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: false
  image_proxy: true
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: "nosniff"
    X-Frame-Options: "sameorigin"
    X-XSS-Protection: "1; mode=block"
    Referrer-Policy: "strict-origin-when-cross-origin"
    Content-Security-Policy: "upgrade-insecure-requests"

# Search settings
search:
  safe_search: 0
  autocomplete: "google"
  autocomplete_min: 4
  enable_doi_resolver: true
  default_lang: ""
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspend_time_on_fail: 60

# UI configuration
ui:
  static_path: "/usr/local/searxng/searx/static"
  templates_path: "/usr/local/searxng/searx/templates"
  allow_robots: false

# Redis (optional, for advanced features)
# redis:
#   url: "unix:///usr/local/searxng/redis.sock"

# Individual search engines can be enabled/disabled per RHIA needs
# This is a minimal config; customize per requirements
